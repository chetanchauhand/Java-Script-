<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberCity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p>NEON DISTRICT // 2088</p>
        <h1>CYBERCITY</h1>
      </div>
      <div class="stats">
        COINS <b id="coins">0</b> · MISSIONS <b id="missions">0</b>
      </div>
    </header>

    <section class="city">
      <div class="moon"></div>
      <div class="building b1"></div>
      <div class="building b2"></div>
      <div class="building b3"></div>
      <div class="road"></div>
      <div id="player">🚀</div>
      <div id="coin">🟡</div>
      <div id="mission">📦</div>
    </section>

    <section class="controls">
      <p>Use W A S D or arrow keys to move. Collect coins and visit the mission package.</p>
      <button id="reset">Reset city</button>
    </section>

    <p id="status">Welcome to the neon district, explorer.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
